<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" width="960" role="img" aria-label="API TESTING · CI/CD PIPELINE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
