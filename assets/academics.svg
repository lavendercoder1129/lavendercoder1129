<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" role="img" aria-label="Academic scores bar chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--bg:#f6f8fa;--bd:#d0d7de;--fg:#1f2328;--mu:#59636e;--ac:#0969da;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--ok:#3fb950}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{fill:var(--fg);font-size:12px;font-weight:600}.s{fill:var(--mu);font-size:10px}
.h{fill:var(--ac);font-size:11px;font-weight:700;letter-spacing:2px}

.tr{fill:var(--bg);stroke:var(--bd)}.bar{fill:var(--ok);transform-box:fill-box;transform-origin:left;animation:gr 1.2s ease-out both}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
<text class="h" x="20" y="24">ACADEMIC SCOREBOARD</text>
<text class="t" x="20" y="66">B.Tech CGPA</text><rect class="tr" x="230" y="50" width="560" height="22" rx="6"/>
<rect class="bar" style="animation-delay:0.0s" x="230" y="50" width="519.1" height="22" rx="6"/>
<text class="t" x="806" y="66">9.27 / 10</text>
<text class="t" x="20" y="106">MHT-CET</text><rect class="tr" x="230" y="90" width="560" height="22" rx="6"/>
<rect class="bar" style="animation-delay:0.15s" x="230" y="90" width="552.8" height="22" rx="6"/>
<text class="t" x="806" y="106">98.71%</text>
<text class="t" x="20" y="146">Secondary (10th)</text><rect class="tr" x="230" y="130" width="560" height="22" rx="6"/>
<rect class="bar" style="animation-delay:0.3s" x="230" y="130" width="543.2" height="22" rx="6"/>
<text class="t" x="806" y="146">97%</text>
<text class="t" x="20" y="186">JEE Mains 2024</text><rect class="tr" x="230" y="170" width="560" height="22" rx="6"/>
<rect class="bar" style="animation-delay:0.44999999999999996s" x="230" y="170" width="515.6" height="22" rx="6"/>
<text class="t" x="806" y="186">92.07%</text>
<text class="t" x="20" y="226">Higher Secondary (12th)</text><rect class="tr" x="230" y="210" width="560" height="22" rx="6"/>
<rect class="bar" style="animation-delay:0.6s" x="230" y="210" width="502.2" height="22" rx="6"/>
<text class="t" x="806" y="226">89.67%</text>
<text class="s" x="20" y="250">Bars are scaled to 100 (CGPA shown on its 10-point scale ×10).</text></svg>