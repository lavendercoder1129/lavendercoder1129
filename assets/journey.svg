<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" role="img" aria-label="Engineering journey" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--bg:#f6f8fa;--bd:#d0d7de;--fg:#1f2328;--mu:#59636e;--ac:#0969da;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--ok:#3fb950}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{fill:var(--fg);font-size:12px;font-weight:600}.s{fill:var(--mu);font-size:10px}
.b{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}.hl{fill:var(--bg);stroke:var(--ok);stroke-width:1.6}
.a{stroke:var(--ac);stroke-width:1.5;fill:none}.h{fill:var(--ac);font-size:11px;font-weight:700;letter-spacing:2px}
</style>
<text class="h" x="20" y="24">ENGINEERING JOURNEY</text>
<line class="a" x1="60" y1="110" x2="900" y2="110"/>
<circle cx="60" cy="110" r="7" class="hl"/>
<text class="h" x="60" y="56" text-anchor="start">2024</text>
<text class="t" x="60" y="70" text-anchor="start">B.Tech AIML</text>
<text class="s" x="60" y="86" text-anchor="start">+ Fintech minor · WCE Sangli</text>
<circle cx="400" cy="110" r="7" class="hl"/>
<text class="h" x="400" y="158" text-anchor="middle">2026</text>
<text class="t" x="400" y="176" text-anchor="middle">WLUG · CodeChef WCE</text>
<text class="s" x="400" y="192" text-anchor="middle">Content Head · Design Head</text>
<circle cx="620" cy="110" r="7" class="hl"/>
<text class="h" x="620" y="56" text-anchor="middle">9 AUG 2026</text>
<text class="t" x="620" y="70" text-anchor="middle">NetNebula session</text>
<text class="s" x="620" y="86" text-anchor="middle">Networking · LinuxDiary 7.0</text>
<circle cx="900" cy="110" r="7" class="hl"/>
<text class="h" x="900" y="158" text-anchor="end">2028</text>
<text class="t" x="900" y="176" text-anchor="end">Graduation</text>
<text class="s" x="900" y="192" text-anchor="end">end of B.Tech program</text>
</svg>